<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Gift 🎁</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at top,#ff1f8f22,#0a0015);
color:white;
overflow:hidden;
}

.container{
text-align:center;
max-width:900px;
padding:40px;
}

h1{
font-size:3rem;
background:linear-gradient(90deg,#ff4da6,#9d7bff,#ffb3d9);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
opacity:0.8;
margin-bottom:40px;
}

.cards{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
}

.card{
width:300px;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.12);
cursor:pointer;
transition:0.3s;
backdrop-filter:blur(15px);
}

.card:hover{
transform:scale(1.07) translateY(-10px);
box-shadow:0 0 40px rgba(255,77,166,0.3);
}

.netflix{
border:1px solid #e50914;
}

.animated{
border:1px solid #9d7bff;
}

</style>
</head>

<body>

<div class="container">

<h1>Your Gift 🎁</h1>
<p>Choose how you want to feel this moment 💖</p>

<div class="cards">

<div class="card netflix" onclick="netflix()">
<h2>🎬 Netflix Experience</h2>
<p>Cinematic emotional journey made for you</p>
</div>

<div class="card animated" onclick="animated()">
<h2>🎞 Animated Story</h2>
<p>Visual emotional storytelling with music</p>
</div>

</div>

</div>

<script>

function netflix(){
window.location.href="https://sujalbalapure5-dot.github.io/It-s-Always-Us/";
}

function animated(){
window.location.href="https://drive.google.com/file/d/1i6CBtIGIWM1pV5N6gPmlXm3U5O4-8G3F/view";
}

</script>

</body>
</html>
