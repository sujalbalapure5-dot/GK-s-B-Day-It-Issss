<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Gift 🎁</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at top,#ff1f8f22,#0a0015);
color:white;
overflow:hidden;
}

.container{
text-align:center;
max-width:900px;
padding:40px;
}

h1{
font-size:3rem;
margin-bottom:15px;
background:linear-gradient(90deg,#ff4da6,#ffb3d9,#9d7bff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
opacity:0.8;
margin-bottom:40px;
}

.cards{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
}

.card{
width:300px;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.12);
cursor:pointer;
transition:0.3s;
backdrop-filter:blur(12px);
}

.card:hover{
transform:translateY(-10px) scale(1.05);
box-shadow:0 0 30px rgba(255,77,166,0.3);
}

.netflix{
border:1px solid #e50914;
}

.animated{
border:1px solid #9d7bff;
}

h2{
margin-bottom:10px;
}

.card p{
font-size:0.9rem;
opacity:0.8;
line-height:1.6;
}

</style>
</head>

<body>

<div class="container">

<h1>Choose Your Gift 🎁</h1>

<p>Two worlds… one feeling 💖</p>

<div class="cards">

<!-- NETFLIX -->
<div class="card netflix" onclick="openNetflix()">
<h2>🎬 Netflix Experience</h2>
<p>
A cinematic emotional story made just for you.
</p>
</div>

<!-- ANIMATED -->
<div class="card animated" onclick="openAnimated()">
<h2>🎞 Animated Video</h2>
<p>
A visual emotional journey with music + storytelling.
</p>
</div>

</div>

</div>

<script>

function openNetflix(){
window.location.href =
"https://sujalbalapure5-dot.github.io/It-s-Always-Us/";
}

function openAnimated(){
window.location.href =
"https://drive.google.com/file/d/1i6CBtIGIWM1pV5N6gPmlXm3U5O4-8G3F/view";
}

</script>

</body>
</html>
