<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK Birthday Countdown 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#05010d;
color:white;
}

/* romantic background */
.bg{
position:absolute;
inset:0;
background:
radial-gradient(circle at 20% 30%, rgba(255,0,120,0.25), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(120,60,255,0.25), transparent 40%),
linear-gradient(135deg,#05010d,#120018,#070012);
animation:bgMove 10s ease-in-out infinite alternate;
z-index:-3;
}

@keyframes bgMove{
0%{filter:hue-rotate(0deg);}
100%{filter:hue-rotate(20deg);}
}

/* MAIN BOX */
.container{
width:90%;
max-width:1000px;
text-align:center;
padding:50px;
backdrop-filter:blur(25px);
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.12);
border-radius:40px;
box-shadow:0 0 90px rgba(255,20,147,0.15);
}

/* TITLE */
h1{
font-size:clamp(2.5rem,7vw,5.5rem);
background:linear-gradient(90deg,#ff4da6,#ffb3d9,#9d7bff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

p{
opacity:0.85;
margin-bottom:35px;
line-height:1.8;
}

/* countdown */
.countdown{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:20px;
}

.card{
padding:25px;
border-radius:25px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.12);
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.number{
font-size:3rem;
font-weight:800;
}

.label{
opacity:0.7;
}

/* =========================
   💖 FIXED FLOATING HEARTS
========================= */

.heart{
position:absolute;
bottom:-20px;
font-size:20px;
opacity:0.8;
animation:floatUp linear forwards;
pointer-events:none;
filter:drop-shadow(0 0 10px #ff4da6);
}

@keyframes floatUp{
0%{
transform:translateY(0) scale(0.6);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-120vh) scale(1.6);
opacity:0;
}
}

/* birthday screen */
.birthday-screen{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
background:radial-gradient(circle,#ff149322,transparent 60%),#05010d;
z-index:100;
}

button{
margin-top:20px;
padding:18px 40px;
border:none;
border-radius:40px;
cursor:pointer;
font-size:1rem;
font-weight:600;
color:white;
background:linear-gradient(90deg,#ff4da6,#9d7bff);
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container" id="main">

<h1>Happy Birthday GK 🎂💖</h1>
<p>Every second falling in love with your existence ✨</p>

<div class="countdown">

<div class="card"><div class="number" id="d">00</div><div class="label">Days</div></div>
<div class="card"><div class="number" id="h">00</div><div class="label">Hours</div></div>
<div class="card"><div class="number" id="m">00</div><div class="label">Minutes</div></div>
<div class="card"><div class="number" id="s">00</div><div class="label">Seconds</div></div>

</div>

</div>

<div class="birthday-screen" id="bd">

<h1>HAPPY BIRTHDAY GK 💖🎂</h1>

<button onclick="unlock()">🎁 Reveal Gift</button>

</div>

<script>

const target = new Date("May 29, 2026 00:00:00").getTime();
const giftPage = "gift.html";

function update(){

const now = new Date().getTime();
const diff = target - now;

if(diff < 0){
document.getElementById("main").style.display="none";
document.getElementById("bd").style.display="flex";
return;
}

document.getElementById("d").innerText=Math.floor(diff/(1000*60*60*24));
document.getElementById("h").innerText=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
document.getElementById("m").innerText=Math.floor((diff%(1000*60*60))/(1000*60));
document.getElementById("s").innerText=Math.floor((diff%(1000*60))/1000);

}

setInterval(update,1000);

/* =========================
   💖 FIXED HEART SYSTEM
========================= */

function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

const emojis=["💖","❤️","💕","💗","💘"];

heart.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

heart.style.left = Math.random()*100 + "vw";

heart.style.fontSize = (Math.random()*25 + 12) + "px";

heart.style.animationDuration = (Math.random()*4 + 4) + "s";

heart.style.opacity = Math.random();

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),8000);

}

setInterval(createHeart,200); // smoother + more continuous flow

function unlock(){
localStorage.setItem("gift","true");
window.location.href=giftPage;
}

</script>

</body>
</html>
