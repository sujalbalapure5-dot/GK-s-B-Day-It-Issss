<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GK Birthday Countdown 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
overflow:hidden;
background:#05010d;
color:white;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

/* ✨ romantic animated background */
.bg{
position:absolute;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(255, 0, 122, 0.25), transparent 35%),
radial-gradient(circle at 80% 70%, rgba(123, 44, 255, 0.25), transparent 40%),
radial-gradient(circle at 50% 50%, rgba(255, 182, 193, 0.12), transparent 60%),
linear-gradient(135deg,#05010d,#120018,#0a0015);
animation:bgMove 10s ease-in-out infinite alternate;
z-index:-2;
}

@keyframes bgMove{
0%{filter:hue-rotate(0deg);}
100%{filter:hue-rotate(20deg);}
}

/* soft glow orbs */
.glow{
position:absolute;
width:520px;
height:520px;
border-radius:50%;
background:radial-gradient(circle, rgba(255,20,147,0.4), transparent 70%);
filter:blur(120px);
animation:float 6s ease-in-out infinite;
z-index:-1;
}

.glow2{
background:radial-gradient(circle, rgba(155,77,255,0.4), transparent 70%);
right:-120px;
bottom:-120px;
animation-delay:2s;
}

@keyframes float{
0%,100%{transform:translateY(0px) scale(1);}
50%{transform:translateY(-25px) scale(1.05);}
}

/* container */
.container{
width:90%;
max-width:1200px;
text-align:center;
padding:40px;
backdrop-filter:blur(25px);
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:45px;
box-shadow:0 0 80px rgba(255,20,147,0.08);
}

/* tag */
.tag{
display:inline-block;
padding:12px 26px;
border-radius:100px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.12);
margin-bottom:25px;
font-size:13px;
letter-spacing:4px;
text-transform:uppercase;
color:#ffd6ec;
}

/* title */
h1{
font-size:clamp(3rem,8vw,7rem);
font-weight:800;
line-height:1.1;
}

.gradient{
background:linear-gradient(90deg,#ff4da6,#ffb3d9,#9d7bff,#ff66c4);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-size:300%;
animation:shine 5s linear infinite;
}

@keyframes shine{
0%{background-position:0%;}
100%{background-position:300%;}
}

.subtitle{
max-width:800px;
margin:auto;
color:#e0e0e0;
font-size:1.2rem;
line-height:1.8;
margin-bottom:55px;
opacity:0.9;
}

/* countdown cards */
.countdown{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:25px;
margin-bottom:45px;
}

.card{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
padding:40px 20px;
border-radius:30px;
transition:0.4s;
backdrop-filter:blur(10px);
}

.card:hover{
transform:translateY(-10px) scale(1.04);
box-shadow:0 0 40px rgba(255,105,180,0.15);
}

.number{
font-size:4rem;
font-weight:800;
background:linear-gradient(to bottom,#fff,#bbb);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.label{
margin-top:10px;
letter-spacing:3px;
text-transform:uppercase;
color:#d0d0d0;
font-size:0.9rem;
}

/* message */
.message{
margin-top:30px;
padding:35px;
border-radius:30px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
font-size:1.15rem;
line-height:2;
color:#f2f2f2;
box-shadow:0 0 30px rgba(255,105,180,0.08);
}

/* ❤️ floating hearts */
.heart{
position:absolute;
color:#ff4da6;
opacity:0.8;
animation:floatUp linear forwards;
pointer-events:none;
filter:drop-shadow(0 0 8px #ff4da6);
}

@keyframes floatUp{
0%{
transform:translateY(100vh) scale(0.5) rotate(0deg);
opacity:0;
}
20%{opacity:1;}
100%{
transform:translateY(-10vh) scale(1.6) rotate(360deg);
opacity:0;
}
}

/* final birthday screen */
.birthday-screen{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
background:
radial-gradient(circle,#ff149322,transparent 60%),
#05010d;
z-index:100;
}

.birthday-screen h2{
font-size:clamp(3rem,8vw,6rem);
margin-bottom:20px;
text-shadow:0 0 30px #ff4da6;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="glow"></div>
<div class="glow glow2"></div>

<div class="container">

<div class="tag">Countdown To GK’s Birthday ✨</div>

<h1>Happy Birthday <span class="gradient">GK 💖</span></h1>

<p class="subtitle">
A universe softly falling in love with your existence… every second closer 🌸
</p>

<div class="countdown">
<div class="card"><div class="number" id="days">00</div><div class="label">Days</div></div>
<div class="card"><div class="number" id="hours">00</div><div class="label">Hours</div></div>
<div class="card"><div class="number" id="minutes">00</div><div class="label">Minutes</div></div>
<div class="card"><div class="number" id="seconds">00</div><div class="label">Seconds</div></div>
</div>

<div class="message">
“Some people become memories.<br>
You became the feeling I never want to lose.” 💖
</div>

</div>

<div class="birthday-screen" id="birthdayScreen">
<h2 class="gradient">HAPPY BIRTHDAY GK 🎂💖</h2>
</div>

<script>

const targetDate = new Date("May 29, 2026 00:00:00").getTime();

function updateCountdown(){

const now = new Date().getTime();
const distance = targetDate - now;

if(distance < 0){
document.getElementById("birthdayScreen").style.display="flex";
return;
}

document.getElementById("days").innerText =
Math.floor(distance/(1000*60*60*24));

document.getElementById("hours").innerText =
Math.floor((distance%(1000*60*60*24))/(1000*60*60));

document.getElementById("minutes").innerText =
Math.floor((distance%(1000*60*60))/(1000*60));

document.getElementById("seconds").innerText =
Math.floor((distance%(1000*60))/1000);

}

setInterval(updateCountdown,1000);

/* ❤️ more natural floating hearts */
function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

const hearts=["💖","❤️","💕","💗","💘"];
heart.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(Math.random()*20+15)+"px";
heart.style.animationDuration=(Math.random()*4+4)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),9000);

}

setInterval(createHeart,250);

</script>

</body>
</html>
